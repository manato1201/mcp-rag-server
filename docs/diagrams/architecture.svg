<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 900" width="1640" role="img" aria-labelledby="t d"><title id="t">MCP RAG Server の構成</title><desc id="d">Claude Desktop などの MCP ホストが、標準入出力の JSON-RPC でこのサーバーを呼ぶ。サーバーは、クエリをベクトル化し、ChromaDB のベクトル検索と BM25 の語の検索を、RRF で合わせて返す。索引は、CLI か watchdog の自動インデックスが、ドキュメントの変更を見て作り直す。</desc><style>
:root{--bg:#ffffff;--grid:#edf0f4;--ink:#1d2433;--muted:#667085;--card:#ffffff;--cardline:#d0d5dd;--lab:#ffffff;
--blue:#1a73e8;--orange:#e8710a;--teal:#0f9d8a;--red:#d92d20;--gray:#667085;--purple:#7a5af8;
--f-blue:#f3f7fe;--f-orange:#fdf6ee;--f-teal:#f0f9f7;--f-red:#fef5f4;--f-gray:#f6f7f9;--f-purple:#f6f3ff}
@media (prefers-color-scheme: dark){:root{--bg:#14171d;--grid:#1f242d;--ink:#e6e9ef;--muted:#98a2b3;--card:#1b2029;--cardline:#3a4150;--lab:#14171d;
--blue:#6ea8fe;--orange:#f5a25d;--teal:#52c7b4;--red:#f97066;--gray:#98a2b3;--purple:#a99bff;
--f-blue:#17202e;--f-orange:#271f17;--f-teal:#152422;--f-red:#2a1b1a;--f-gray:#1a1e26;--f-purple:#1f1b2e}}
text{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;fill:var(--ink)}
.mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace}
.title{font-size:16px;font-weight:600;text-anchor:middle}
.sub{font-size:11.5px;text-anchor:middle;fill:var(--muted)}
.glabel{font-size:12.5px;font-weight:700;letter-spacing:.08em}
.alabel{font-size:12px;text-anchor:middle;fill:var(--muted)}
.alabel.blue{fill:var(--blue)} .alabel.orange{fill:var(--orange)} .alabel.red{fill:var(--red)}
.note{font-size:12px;fill:var(--muted)}
.hd{font-size:20px;font-weight:700}
.card{fill:var(--card);stroke:var(--cardline);stroke-width:1.2}
.ic{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic .fill{fill:var(--ink);stroke:none}
.lab{fill:var(--lab)}
.a{fill:none;stroke-width:2}
.a.primary{stroke:var(--blue)} .a.secondary{stroke:var(--gray);stroke-dasharray:6 5} .a.accent{stroke:var(--orange)} .a.danger{stroke:var(--red);stroke-dasharray:6 5}
.h.primary{fill:var(--blue)} .h.secondary{fill:var(--gray)} .h.accent{fill:var(--orange)} .h.danger{fill:var(--red)}
.badge{font-size:11px;font-weight:700;text-anchor:middle;fill:#fff}
</style><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><rect width="1640" height="900" fill="var(--bg)"/><rect width="1640" height="900" fill="url(#g)"/><rect x="220" y="100" width="840" height="520" rx="14" fill="var(--f-teal)" stroke="var(--teal)" stroke-width="1.5"/><rect x="242" y="90" width="258.0" height="20" fill="var(--bg)"/><text class="glabel mono" x="248" y="104.5" style="fill:var(--teal)">MCP RAG SERVER — PYTHON (src/)</text><rect x="1160" y="100" width="440" height="520" rx="14" fill="var(--f-gray)" stroke="var(--gray)" stroke-width="1.5"/><rect x="1182" y="90" width="151.39999999999998" height="20" fill="var(--bg)"/><text class="glabel mono" x="1188" y="104.5" style="fill:var(--gray)">LOCAL DATA — ファイル</text><rect x="220" y="700" width="1380" height="160" rx="14" fill="var(--f-purple)" stroke="var(--purple)" stroke-width="1.5"/><rect x="242" y="690" width="208.79999999999998" height="20" fill="var(--bg)"/><text class="glabel mono" x="248" y="704.5" style="fill:var(--purple)">INDEXING — 索引を作る(利用者・自動)</text><path class="a primary" d="M132.0 330.0 L180.0 330.0 L180.0 220.0 L298.0 220.0"/><path class="h primary" d="M298.0 220.0 L287.0 214.5 L287.0 225.5 Z"/><path class="a primary" d="M362.0 220.0 L528.0 220.0"/><path class="h primary" d="M528.0 220.0 L517.0 214.5 L517.0 225.5 Z"/><path class="a primary" d="M592.0 220.0 L758.0 220.0"/><path class="h primary" d="M758.0 220.0 L747.0 214.5 L747.0 225.5 Z"/><path class="a primary" d="M822.0 220.0 L930.0 220.0 L930.0 350.0 L330.0 350.0 L330.0 408.0"/><path class="h primary" d="M330.0 408.0 L335.5 397.0 L324.5 397.0 Z"/><path class="a primary" d="M822.0 220.0 L930.0 220.0 L930.0 350.0 L560.0 350.0 L560.0 408.0"/><path class="h primary" d="M560.0 408.0 L565.5 397.0 L554.5 397.0 Z"/><path class="a primary" d="M822.0 220.0 L930.0 220.0 L930.0 350.0 L790.0 350.0 L790.0 408.0"/><path class="h primary" d="M790.0 408.0 L795.5 397.0 L784.5 397.0 Z"/><path class="a primary" d="M822.0 440.0 L1100.0 440.0 L1100.0 460.0 L1228.0 460.0"/><path class="h primary" d="M1228.0 460.0 L1217.0 454.5 L1217.0 465.5 Z"/><path class="a secondary" d="M452.0 770.0 L668.0 770.0"/><path class="h secondary" d="M668.0 770.0 L657.0 764.5 L657.0 775.5 Z"/><path class="h secondary" d="M452.0 770.0 L463.0 775.5 L463.0 764.5 Z"/><path class="a secondary" d="M1030.0 770.0 L1380.0 770.0 L1380.0 620.0"/><path class="h secondary" d="M1380.0 620.0 L1374.5 631.0 L1385.5 631.0 Z"/><rect class="card" x="68.0" y="298.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(80.0 310.0) scale(1.000)"><circle cx="20" cy="13" r="7"/><path d="M6 35c0-8 6-13 14-13s14 5 14 13"/></g><rect class="card" x="298.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(310.0 200.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M11 16l6 5-6 5M21 27h8"/></g><rect class="card" x="528.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(540.0 200.0) scale(1.000)"><path d="M9 13h8a4 4 0 1 1 8 0h6v8a4 4 0 1 0 0 8v5H9z"/></g><rect class="card" x="758.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(770.0 200.0) scale(1.000)"><circle cx="20" cy="20" r="6"/><path d="M20 4v6M20 30v6M4 20h6M30 20h6M8.7 8.7l4.2 4.2M27.1 27.1l4.2 4.2M31.3 8.7l-4.2 4.2M12.9 27.1l-4.2 4.2"/></g><rect class="card" x="298.0" y="408.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(310.0 420.0) scale(1.000)"><path d="M10 4h14l8 8v24H10z"/><path d="M24 4v8h8M15 20h12M15 26h12M15 32h8"/></g><rect class="card" x="528.0" y="408.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(540.0 420.0) scale(1.000)"><path d="M7 17v6M12.5 11v18M18 6v28M23.5 13v14M29 9v22M34 16v8"/></g><rect class="card" x="758.0" y="408.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(770.0 420.0) scale(1.000)"><ellipse cx="20" cy="9" rx="13" ry="4.5"/><path d="M7 9v22c0 2.5 5.8 4.5 13 4.5S33 33.500 33 31V9M7 20c0 2.5 5.8 4.500 13 4.500S33 22.500 33 20"/></g><rect class="card" x="1228.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1240.0 200.0) scale(1.000)"><path d="M4 10a3 3 0 0 1 3-3h8l4 5h14a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/></g><rect class="card" x="1448.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1460.0 200.0) scale(1.000)"><path d="M10 4h14l8 8v24H10z"/><path d="M24 4v8h8M15 20h12M15 26h12M15 32h8"/></g><rect class="card" x="1228.0" y="408.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1240.0 420.0) scale(1.000)"><ellipse cx="20" cy="9" rx="13" ry="4.5"/><path d="M7 9v22c0 2.5 5.8 4.5 13 4.5S33 33.500 33 31V9M7 20c0 2.5 5.8 4.500 13 4.500S33 22.500 33 20"/></g><rect class="card" x="1448.0" y="408.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1460.0 420.0) scale(1.000)"><path d="M14 11h22M14 20h22M14 29h22"/><circle class="fill" cx="7" cy="11" r="2"/><circle class="fill" cx="7" cy="20" r="2"/><circle class="fill" cx="7" cy="29" r="2"/></g><rect class="card" x="388.0" y="738.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(400.0 750.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M11 16l6 5-6 5M21 27h8"/></g><rect class="card" x="668.0" y="738.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(680.0 750.0) scale(1.000)"><circle cx="20" cy="20" r="15"/><path d="M20 10v10l7 4"/></g><rect class="card" x="948.0" y="738.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(960.0 750.0) scale(1.000)"><circle cx="20" cy="20" r="15"/><path d="M12 20l6 6 11-12"/></g><text class="title" x="100" y="382.0">MCP ホスト</text><text class="sub mono" x="100" y="401.0">Claude Desktop など</text><text class="title" x="330" y="272.0">mcp_server</text><text class="sub mono" x="330" y="291.0">JSON-RPC over stdio</text><text class="title" x="560" y="272.0">rag_tools</text><text class="sub mono" x="560" y="291.0">search</text><text class="sub mono" x="560" y="306.0">get_document_count</text><text class="title" x="790" y="272.0">rag_service</text><text class="sub mono" x="790" y="291.0">索引と検索の統括</text><text class="title" x="330" y="492.0">document_processor</text><text class="sub mono" x="330" y="511.0">markitdown・チャンク分割</text><text class="sub mono" x="330" y="526.0">差分(ファイルのハッシュ)</text><text class="title" x="560" y="492.0">embedding_generator</text><text class="sub mono" x="560" y="511.0">multilingual-e5</text><text class="sub mono" x="560" y="526.0">(クエリ / 文書の接頭辞)</text><text class="title" x="790" y="492.0">vector_database</text><text class="sub mono" x="790" y="511.0">Chroma + BM25 + RRF</text><text class="sub mono" x="790" y="526.0">Sudachi で日本語</text><rect class="lab" x="201.7" y="199.0" width="74.6" height="16" rx="3"/><text class="alabel mono blue" x="239.0" y="211.0">tools/call</text><text class="title" x="1260" y="272.0">SOURCE_DIR</text><text class="sub mono" x="1260" y="291.0">Obsidian vault など</text><text class="sub mono" x="1260" y="306.0">最初の階層 = namespace</text><text class="title" x="1480" y="272.0">processed/</text><text class="sub mono" x="1480" y="291.0">変換済みの Markdown</text><text class="sub mono" x="1480" y="306.0">file_registry.json</text><text class="title" x="1260" y="492.0">data/chroma/</text><text class="sub mono" x="1260" y="511.0">コレクション</text><text class="sub mono" x="1260" y="526.0">(namespace ごと)</text><text class="title" x="1480" y="492.0">bm25/*.pkl</text><text class="sub mono" x="1480" y="511.0">BM25 の索引</text><text class="sub mono" x="1480" y="526.0">(namespace ごと)</text><rect class="lab" x="1064.4" y="429.0" width="71.2" height="16" rx="3"/><text class="alabel mono blue" x="1100.0" y="441.0">保存・検索</text><text class="title" x="420" y="822.0">cli.py index</text><text class="sub mono" x="420" y="841.0">全部 / --incremental</text><text class="title" x="700" y="822.0">auto_index.py</text><text class="sub mono" x="700" y="841.0">watchdog が保存を監視</text><text class="title" x="980" y="822.0">期限(expires)</text><text class="sub mono" x="980" y="841.0">frontmatter で古い文書を整理</text><rect class="lab" x="1091.2" y="749.0" width="227.6" height="16" rx="3"/><text class="alabel mono " x="1205.0" y="761.0">rag_service.index_documents を呼ぶ</text><text class="hd" x="40" y="44" text-anchor="start">MCP RAG Server — 構成</text><text class="note" x="40" y="66" text-anchor="start">青=検索の流れ / 灰の破線=索引を作る側 / すべてこの PC の中(外へ送らない)</text></svg>
